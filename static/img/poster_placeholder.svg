<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%" role="img" aria-label="No poster available">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171B24" />
      <stop offset="100%" stop-color="#0E1118" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="300" height="450" fill="url(#bgGrad)" rx="8" />
  <rect x="1" y="1" width="298" height="448" fill="none" stroke="#262C3A" stroke-width="1.5" rx="7" />

  <!-- Subtle ambient glow circle -->
  <circle cx="150" cy="180" r="75" fill="url(#accentGlow)" filter="blur(24px)" />

  <!-- Television / Film Icon -->
  <g transform="translate(110, 135)" fill="none" stroke="#6366F1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- TV frame -->
    <rect x="0" y="20" width="80" height="58" rx="6" fill="#11141B" fill-opacity="0.9" stroke="#3A4254" />
    <!-- TV Antenna -->
    <path d="M22 6 L40 20 L58 6" stroke="#A3A8B5" stroke-width="2" />
    <!-- Play triangle -->
    <polygon points="34,36 34,62 54,49" fill="#6366F1" stroke="none" opacity="0.95" />
    <!-- Stand -->
    <path d="M28 84 L52 84 M40 78 L40 84" stroke="#A3A8B5" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="150" y="260" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">BingeBuddy</text>
  <text x="150" y="285" fill="#A3A8B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" text-anchor="middle">No Poster Available</text>
  <text x="150" y="306" fill="#717786" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Local TMDB Archive</text>
</svg>
